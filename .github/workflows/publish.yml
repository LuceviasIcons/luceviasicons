name: Publish packages

# Публикация по тегу: git tag v0.2.0 && git push --tags
# Версия берётся из тега, чтобы package.json и npm не разъезжались.
#
# Публикуются оба пакета одной версией:
#   @lucevias/core — сырые SVG и метаданные (его ставит сайт-каталог)
#   lucevias       — React-компоненты (его ставят пользователи)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # write нужен, чтобы вернуть в репозиторий history.json — см. шаг в конце
      contents: write
      id-token: write # provenance: npm подтверждает, что пакет собран в этом репо
    steps:
      - uses: actions/checkout@v4
        with:
          # тег указывает на коммит, а история дописывается в ветку
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Синхронизировать версию с тегом
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for pkg in packages/core packages/icons; do
            (cd "$pkg" && npm version "$VERSION" --no-git-tag-version --allow-same-version)
          done

      # core собирается первым: метаданные считаются из тех же SVG,
      # что и React-компоненты, и версия внутри icons.json берётся из package.json
      - name: Собрать @lucevias/core
        run: npm run core:build

      - name: Опубликовать @lucevias/core
        working-directory: packages/core
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Собрать lucevias
        run: npm run pkg:build

      - name: Опубликовать lucevias
        working-directory: packages/icons
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # history.json обновляется при сборке: новые иконки получают версию
      # этого релиза. Без возврата в репозиторий запись пропала бы вместе с
      # раннером, и следующий релиз пометил бы те же иконки новыми повторно.
      - name: Вернуть историю версий в репозиторий
        run: |
          if git diff --quiet packages/core/history.json; then
            echo "История не изменилась"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/core/history.json
          git commit -m "История версий: ${GITHUB_REF_NAME}"
          git push origin main
