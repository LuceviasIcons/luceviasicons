name: Publish packages

# Publish on tag: git tag v0.2.0 && git push --tags
# The version comes from the tag so that package.json and npm never drift apart.
#
# Both packages are published under one version:
#   @lucevias/core — raw SVG and metadata (installed by the catalog site)
#   lucevias       — React components (installed by users)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # write is needed to push history.json back to the repo — see the final step
      contents: write
      id-token: write # provenance: npm confirms the package was built in this repo
    steps:
      - uses: actions/checkout@v4
        with:
          # the tag points at a commit, while the history is appended to the branch
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Sync version with the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for pkg in packages/core packages/icons; do
            (cd "$pkg" && npm version "$VERSION" --no-git-tag-version --allow-same-version)
          done

      # core is built first: the metadata is computed from the same SVGs as the
      # React components, and the version inside icons.json comes from package.json
      - name: Build @lucevias/core
        run: npm run core:build

      - name: Publish @lucevias/core
        working-directory: packages/core
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build lucevias
        run: npm run pkg:build

      - name: Publish lucevias
        working-directory: packages/icons
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # history.json is updated during the build: new icons get the date of this
      # release. Without pushing it back, the record would vanish with the runner,
      # and the next release would mark the same icons as new all over again.
      - name: Push the version history back to the repository
        run: |
          if git diff --quiet packages/core/history.json; then
            echo "History unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/core/history.json
          git commit -m "Version history: ${GITHUB_REF_NAME}"
          git push origin main
